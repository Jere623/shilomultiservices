services:
  - type: web
    name: shilomultiservices
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: shilomultiservices-db
          property: connectionString
databases:
  - name: shilomultiservices-db
